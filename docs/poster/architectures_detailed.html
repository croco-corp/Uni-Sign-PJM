<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Architecture diagrams</title>
<style>
 :root {
 --frozen-fill: #f0f4f9;
 --frozen-stroke:#8a98a8;

 --trained-fill: #eef2f7;
 --trained-stroke:#6b7c93;

 --acc-fill: #fff1e6;
 --acc-stroke: #c9582b;

 --img-fill: #fafafa;
 --img-stroke: #b8b8b8;

 --ink: #1f2937;
 --muted: #6b7280;
 }

 body {
 font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
 margin: 0; padding: 24px;
 background: white; color: var(--ink);
 }
 h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
 h2 { font-size: 18px; font-weight: 700; margin: 36px 0 8px; padding: 0 0 4px; border-bottom: 1px solid #ddd; }

 .legend { font-size: 13px; color: var(--muted); margin: 8px 0 24px; display: flex; gap: 22px; }
 .legend .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 6px; border: 1.5px solid; }
 .legend .frozen { background: var(--frozen-fill); border-color: var(--frozen-stroke); border-style: dashed; }
 .legend .trained { background: var(--trained-fill); border-color: var(--trained-stroke); }
 .legend .new { background: var(--acc-fill); border-color: var(--acc-stroke); }
 .legend .img { background: var(--img-fill); border-color: var(--img-stroke); border-style: dashed; }

 svg { max-width: 100%; height: auto; }

 svg .img { fill: var(--img-fill); stroke: var(--img-stroke); stroke-width: 1.2; stroke-dasharray: 5 3; }
 svg .frozen { fill: var(--frozen-fill); stroke: var(--frozen-stroke); stroke-width: 1.5; stroke-dasharray: 4 3; }
 svg .trained { fill: var(--trained-fill); stroke: var(--trained-stroke); stroke-width: 1.8; }
 svg .new { fill: var(--acc-fill); stroke: var(--acc-stroke); stroke-width: 2; }
 svg .out { fill: white; stroke: var(--ink); stroke-width: 1.8; }

 svg .lbl { font: 600 14px "Inter", sans-serif; fill: #2b3a4a; }
 svg .lbl-out { font: 700 14px "Inter", sans-serif; fill: var(--ink); }
 svg .sub { font: 400 11px "Inter", sans-serif; fill: var(--muted); }
 svg .img-lbl { font: italic 500 12px "Inter", sans-serif; fill: var(--muted); }
 svg .marker { font: 700 11px "Inter", sans-serif; }

 svg .arrow { stroke: #6b7c93; stroke-width: 1.6; fill: none; }
 svg .arrow-acc { stroke: var(--acc-stroke); stroke-width: 1.8; fill: none; }

 @media print {
 @page { size: A1 landscape; margin: 0; }
 body { padding: 14mm; }
 }
</style>
</head>
<body>

<h1>Architecture diagrams</h1>
<div class="legend">
<span><span class="swatch img"></span>image / data placeholder</span>
<span><span class="swatch frozen"></span>❄ frozen</span>
<span><span class="swatch trained"></span>🔥 trained</span>
<span><span class="swatch new"></span>added in this work</span>
</div>


<!-- ====================================================================
 A · SpaMo (dual)
===================================================================== -->
<h2>SpaMo (dual streams)</h2>
<svg viewBox="0 0 1450 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 Z" style="fill: #6b7c93"/>
</marker>
</defs>

<!-- input: video clip -->
<rect class="img" x="30" y="60" width="230" height="240" rx="6"/>
<text x="145" y="180" text-anchor="middle" class="img-lbl">[insert]</text>
<text x="145" y="198" text-anchor="middle" class="img-lbl">PJM signer video clip</text>
<text x="145" y="320" text-anchor="middle" class="lbl">RGB frames</text>

<!-- ViT -->
<rect class="frozen" x="320" y="80" width="200" height="80" rx="6"/>
<text x="420" y="110" text-anchor="middle" class="lbl">ViT</text>
<text x="420" y="128" text-anchor="middle" class="sub">spatial features</text>
<text x="420" y="148" text-anchor="middle" class="marker" fill="#3a4756">❄ frozen</text>

<!-- MAE -->
<rect class="frozen" x="320" y="200" width="200" height="80" rx="6"/>
<text x="420" y="230" text-anchor="middle" class="lbl">MAE</text>
<text x="420" y="248" text-anchor="middle" class="sub">motion features</text>
<text x="420" y="268" text-anchor="middle" class="marker" fill="#3a4756">❄ frozen</text>

<!-- Fusion -->
<rect class="trained" x="600" y="100" width="280" height="160" rx="8"/>
<text x="740" y="140" text-anchor="middle" class="lbl" style="font-size:16px">Fusion</text>
<text x="740" y="162" text-anchor="middle" class="sub">joint multi-stream</text>
<text x="740" y="180" text-anchor="middle" class="sub">+ cross-modal alignment</text>
<text x="740" y="198" text-anchor="middle" class="sub">+ cross-lingual in-context</text>
<text x="740" y="232" text-anchor="middle" class="marker" fill="var(--acc-stroke)">🔥 trained</text>

<!-- LLM -->
<rect class="trained" x="950" y="120" width="260" height="120" rx="8"/>
<text x="1080" y="160" text-anchor="middle" class="lbl" style="font-size:16px">FlanT5-xl</text>
<text x="1080" y="180" text-anchor="middle" class="sub">decoder · 3 B params</text>
<text x="1080" y="200" text-anchor="middle" class="sub">LoRA r=16, α=32</text>
<text x="1080" y="222" text-anchor="middle" class="marker" fill="var(--acc-stroke)">🔥 fine-tuned</text>

<!-- output -->
<rect class="out" x="1260" y="140" width="170" height="80" rx="6"/>
<text x="1345" y="172" text-anchor="middle" class="lbl-out">Spoken-language</text>
<text x="1345" y="192" text-anchor="middle" class="lbl-out">text</text>
<text x="1345" y="210" text-anchor="middle" class="sub">EN / PL</text>

<!-- arrows -->
<path class="arrow" d="M260,180 L295,180 L295,120 L318,120" marker-end="url(#arrA)"/>
<path class="arrow" d="M260,180 L295,180 L295,240 L318,240" marker-end="url(#arrA)"/>
<path class="arrow" d="M520,120 L555,120 L555,150 L598,150" marker-end="url(#arrA)"/>
<path class="arrow" d="M520,240 L555,240 L555,210 L598,210" marker-end="url(#arrA)"/>
<path class="arrow" d="M880,180 L948,180" marker-end="url(#arrA)"/>
<path class="arrow" d="M1210,180 L1258,180" marker-end="url(#arrA)"/>
</svg>


<!-- ====================================================================
 B · mod-SpaMo (quad + dropout)
===================================================================== -->
<h2>mod-SpaMo (quad streams + fusion dropout)</h2>
<svg viewBox="0 0 1450 540" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 Z" style="fill: #6b7c93"/>
</marker>
<marker id="arrBn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 Z" style="fill: var(--acc-stroke)"/>
</marker>
</defs>

<!-- inputs: video + hand crops + landmarks (3 stacked image slots) -->
<rect class="img" x="30" y="50" width="230" height="120" rx="6"/>
<text x="145" y="105" text-anchor="middle" class="img-lbl">[insert]</text>
<text x="145" y="123" text-anchor="middle" class="img-lbl">full-frame signer</text>

<rect class="img" x="30" y="190" width="230" height="120" rx="6"/>
<text x="145" y="245" text-anchor="middle" class="img-lbl">[insert]</text>
<text x="145" y="263" text-anchor="middle" class="img-lbl">hand crop</text>

<rect class="img" x="30" y="330" width="230" height="120" rx="6"/>
<text x="145" y="385" text-anchor="middle" class="img-lbl">[insert]</text>
<text x="145" y="403" text-anchor="middle" class="img-lbl">MediaPipe landmarks</text>

<!-- 4 streams -->
<rect class="frozen" x="320" y="50" width="200" height="70" rx="6"/>
<text x="420" y="78" text-anchor="middle" class="lbl">ViT</text>
<text x="420" y="96" text-anchor="middle" class="sub">spatial · ❄ frozen</text>

<rect class="frozen" x="320" y="135" width="200" height="70" rx="6"/>
<text x="420" y="163" text-anchor="middle" class="lbl">MAE</text>
<text x="420" y="181" text-anchor="middle" class="sub">motion · ❄ frozen</text>

<rect class="new" x="320" y="220" width="200" height="70" rx="6"/>
<text x="420" y="248" text-anchor="middle" class="lbl">hand-ViT</text>
<text x="420" y="266" text-anchor="middle" class="sub">cropped hands · ❄ frozen</text>

<rect class="new" x="320" y="305" width="200" height="70" rx="6"/>
<text x="420" y="333" text-anchor="middle" class="lbl">MediaPipe</text>
<text x="420" y="351" text-anchor="middle" class="sub">2D landmarks · ❄ frozen</text>

<!-- Fusion -->
<rect class="new" x="600" y="100" width="280" height="240" rx="8"/>
<text x="740" y="140" text-anchor="middle" class="lbl" style="font-size:16px">Fusion</text>
<text x="740" y="162" text-anchor="middle" class="sub">joint 4-stream</text>
<text x="740" y="180" text-anchor="middle" class="sub">+<tspan font-weight="700" fill="var(--acc-stroke)">dropout</tspan> (added)</text>
<text x="740" y="200" text-anchor="middle" class="sub">+ cross-modal alignment</text>
<text x="740" y="218" text-anchor="middle" class="sub">+ cross-lingual in-context</text>
<text x="740" y="252" text-anchor="middle" class="marker" fill="var(--acc-stroke)">🔥 trained</text>

<!-- LLM -->
<rect class="trained" x="950" y="160" width="260" height="120" rx="8"/>
<text x="1080" y="200" text-anchor="middle" class="lbl" style="font-size:16px">FlanT5-xl</text>
<text x="1080" y="220" text-anchor="middle" class="sub">decoder · 3 B params</text>
<text x="1080" y="240" text-anchor="middle" class="sub">LoRA r=16, α=32</text>
<text x="1080" y="262" text-anchor="middle" class="marker" fill="var(--acc-stroke)">🔥 fine-tuned</text>

<!-- output -->
<rect class="out" x="1260" y="180" width="170" height="80" rx="6"/>
<text x="1345" y="212" text-anchor="middle" class="lbl-out">Spoken-language</text>
<text x="1345" y="232" text-anchor="middle" class="lbl-out">text</text>
<text x="1345" y="250" text-anchor="middle" class="sub">EN / PL</text>

<!-- arrows -->
<path class="arrow" d="M260,110 L295,110 L295,85 L318,85" marker-end="url(#arrB)"/>
<path class="arrow" d="M260,250 L295,250 L295,170 L318,170" marker-end="url(#arrB)"/>
<path class="arrow-acc" d="M260,250 L295,250 L295,255 L318,255" marker-end="url(#arrBn)"/>
<path class="arrow-acc" d="M260,390 L295,390 L295,340 L318,340" marker-end="url(#arrBn)"/>

<path class="arrow" d="M520,85 L555,85 L555,150 L598,150" marker-end="url(#arrB)"/>
<path class="arrow" d="M520,170 L555,170 L555,195 L598,195" marker-end="url(#arrB)"/>
<path class="arrow-acc" d="M520,255 L555,255 L555,245 L598,245" marker-end="url(#arrBn)"/>
<path class="arrow-acc" d="M520,340 L555,340 L555,290 L598,290" marker-end="url(#arrBn)"/>

<path class="arrow" d="M880,220 L948,220" marker-end="url(#arrB)"/>
<path class="arrow" d="M1210,220 L1258,220" marker-end="url(#arrB)"/>
</svg>


<!-- ====================================================================
 C · Uni-Sign + PJM (pose-only)
===================================================================== -->
<h2>Uni-Sign + PJM (pose-only fine-tune)</h2>
<svg viewBox="0 0 1450 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 Z" style="fill: #6b7c93"/>
</marker>
</defs>

<!-- input: keypoints sequence -->
<rect class="img" x="30" y="60" width="230" height="240" rx="6"/>
<text x="145" y="170" text-anchor="middle" class="img-lbl">[insert]</text>
<text x="145" y="188" text-anchor="middle" class="img-lbl">PJM signer with</text>
<text x="145" y="204" text-anchor="middle" class="img-lbl">pose / hand keypoints overlay</text>
<text x="145" y="320" text-anchor="middle" class="lbl">Keypoints sequence</text>

<!-- Sub-pose split -->
<rect class="trained" x="320" y="120" width="200" height="120" rx="6"/>
<text x="420" y="160" text-anchor="middle" class="lbl">Sub-pose split</text>
<text x="420" y="180" text-anchor="middle" class="sub">left hand · right hand</text>
<text x="420" y="196" text-anchor="middle" class="sub">body · face</text>
<text x="420" y="222" text-anchor="middle" class="marker" fill="var(--acc-stroke)">🔥 trained</text>

<!-- PGF + Pose Encoder + Temporal Encoder (combined column) -->
<rect class="trained" x="600" y="100" width="240" height="160" rx="8"/>
<text x="720" y="138" text-anchor="middle" class="lbl" style="font-size:16px">Pose Encoders</text>
<text x="720" y="160" text-anchor="middle" class="sub">PGF (prior-guided fusion)</text>
<text x="720" y="178" text-anchor="middle" class="sub">+ per-stream pose encoder</text>
<text x="720" y="196" text-anchor="middle" class="sub">+ temporal encoder</text>
<text x="720" y="232" text-anchor="middle" class="marker" fill="var(--acc-stroke)">🔥 trained</text>

<!-- Concat -->
<rect class="trained" x="920" y="140" width="160" height="80" rx="6"/>
<text x="1000" y="172" text-anchor="middle" class="lbl">Feature concat</text>
<text x="1000" y="190" text-anchor="middle" class="sub">→ token sequence</text>

<!-- LLM -->
<rect class="trained" x="1130" y="120" width="200" height="120" rx="8"/>
<text x="1230" y="160" text-anchor="middle" class="lbl" style="font-size:16px">mT5-base</text>
<text x="1230" y="180" text-anchor="middle" class="sub">decoder · 580 M</text>
<text x="1230" y="200" text-anchor="middle" class="sub">LoRA on attention</text>
<text x="1230" y="222" text-anchor="middle" class="marker" fill="var(--acc-stroke)">🔥 fine-tuned</text>

<!-- output -->
<rect class="out" x="1370" y="140" width="60" height="80" rx="6"/>
<text x="1400" y="172" text-anchor="middle" class="lbl-out">Text</text>
<text x="1400" y="192" text-anchor="middle" class="sub">EN /</text>
<text x="1400" y="208" text-anchor="middle" class="sub">PL</text>

<!-- arrows -->
<path class="arrow" d="M260,180 L318,180" marker-end="url(#arrC)"/>
<path class="arrow" d="M520,180 L598,180" marker-end="url(#arrC)"/>
<path class="arrow" d="M840,180 L918,180" marker-end="url(#arrC)"/>
<path class="arrow" d="M1080,180 L1128,180" marker-end="url(#arrC)"/>
<path class="arrow" d="M1330,180 L1368,180" marker-end="url(#arrC)"/>
</svg>

</body>
</html>
